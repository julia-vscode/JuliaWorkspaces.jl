name: Julia CI

on:
  push: {branches: [main,master]}
  pull_request: {types: [opened,synchronize,reopened,ready_for_review,converted_to_draft,closed]}
  issue_comment: {types: [created]}
  workflow_dispatch: {inputs: {feature: {type: choice, description: What to run, options: [DocDeploy,LintAndTest,TagBot]}}}

jobs:
  julia-ci:
    uses: julia-testitems/testitem-workflow/.github/workflows/juliaci.yml@v2
    with:
      include-all-compatible-minor-versions: true
      include-rc-versions: true
      # A full GC after every test item (the default with more than one test process)
      # takes 40-75s per collection on the macOS aarch64 runners under Julia >= 1.12,
      # which pushed those legs past the 6h job limit.
      gc-between-testitems: "false"
      # Which files hold test items is decided by JuliaTestItems.toml, not here.
      github_job_prep_script: .github/ci_prep.jl
    permissions: write-all
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
