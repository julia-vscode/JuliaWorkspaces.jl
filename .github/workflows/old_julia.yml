name: Old Julia symbol server smoke test

# shared/symbolserver is also loaded by the dynamic analysis process, which runs on every
# Julia back to 1.0, but the main CI only covers the versions this package supports.
# This runs a crawl + cache round-trip of Core, Base and a stdlib on old Julia versions.

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.0/1.1: no fieldtypes/get_world_counter; 1.3: fieldtypes throws for Core.Module,
        # no mktemp(cleanup); 1.6: no TypeofVararg; 1.8: no unsorted_names/getglobal.
        version: ['1.0', '1.1', '1.3', '1.6', '1.8']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - run: julia --color=yes --startup-file=no test/old_julia/crawl_smoke.jl
